<!doctype html>
<html lang="ja">

<title>早押しステージ</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden;
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  canvas{display:block}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#1a2340 0%,#05060a 70%);z-index:10;cursor:pointer;text-align:center}
  #start h1{font-size:clamp(32px,7vw,64px);letter-spacing:.12em;margin:0 0 8px;font-weight:800}
  #start p{opacity:.75;margin:4px 16px}
  #start .tap{margin-top:28px;padding:14px 34px;border:1px solid rgba(255,255,255,.4);border-radius:999px;
    animation:pulse 1.6s ease-in-out infinite}
  #start .load{margin-top:18px;font-size:13px;opacity:.6}
  @keyframes pulse{50%{opacity:.45}}
  #hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 16px 0;
    display:flex;justify-content:space-between;pointer-events:none;font-size:13px;opacity:.8;z-index:3}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);
    font-size:13px;opacity:.7;pointer-events:none;z-index:3;transition:opacity .4s;white-space:nowrap}
  #answer{position:fixed;left:32%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);
    display:none;flex-direction:column;align-items:center;gap:8px;z-index:4}
  #tbar{width:min(520px,80vw);height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
  #tbar i{display:block;height:100%;width:100%;background:#ffcc33}
  #choices{display:flex;gap:10px}
  #choices button{width:clamp(64px,11vw,96px);height:clamp(64px,11vw,96px);border-radius:16px;
    border:1px solid rgba(255,255,255,.35);background:rgba(15,20,35,.72);color:#fff;
    font-size:clamp(28px,5vw,44px);font-weight:700;font-family:inherit;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:manipulation}
  #choices button:active{background:rgba(255,204,51,.5)}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:#05060a;z-index:20;font-size:18px;text-align:center;padding:16px}
  @media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}

<body>
<div id="start">

  <p>あなたは早押しクイズ大会の出場者です</p>
  <p style="font-size:13px">（試作版・会場の確認用）</p>
  <div class="tap">タップして入場</div>
  <div class="load" id="load">会場を準備中…</div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============ 基本設定 ============ */
const isMobile = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent) ||
  (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const FONT = '"Hiragino Sans","Noto Sans JP","Yu Gothic","WenQuanYi Zen Hei",sans-serif';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
let pixelRatio = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04050a);
scene.fog = new THREE.Fog(0x070912, 16, 42);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.03, 80);
camera.rotation.order = 'YXZ';

// ギザギザを消すため、4倍のマルチサンプルで描く
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth * pixelRatio, innerHeight * pixelRatio, { samples: 4, type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.5, 0.45, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let useBloom = true;

/* ============ 小道具 ============ */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261126);
const pick = (a, r = R) => a[Math.floor(r() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function woodTex() {
  return canvasTex(1024, 256, (g, w, h) => {
    g.fillStyle = '#5a3b22'; g.fillRect(0, 0, w, h);
    const r = rng(7);
    for (let i = 0; i < 220; i++) {
      const y = r() * h, a = .04 + r() * .12, ph = r() * 10, amp = 2 + r() * 6;
      g.strokeStyle = r() > .5 ? `rgba(30,15,5,${a})` : `rgba(160,110,70,${a * .7})`;
      g.lineWidth = .6 + r() * 2.2; g.beginPath();
      for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x / 140 + ph) * amp + Math.sin(x / 37 + ph) * amp * .25);
      g.stroke();
    }
  }, [1, 1]);
}
function noiseTex(base, amt, size = 256, rep = [4, 4]) {
  return canvasTex(size, size, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const d = g.getImageData(0, 0, w, h), r = rng(3);
    for (let i = 0; i < d.data.length; i += 4) { const n = (r() - .5) * amt;
      d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; }
    g.putImageData(d, 0, 0);
  }, rep);
}
function floorTex() {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#101219'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 2;
    for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke();
      g.beginPath(); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke(); }
  }, [14, 14]);
}

const M = {
  metal: new THREE.MeshStandardMaterial({ color: 0x9aa0a8, metalness: 1, roughness: .32 }),
  darkMetal: new THREE.MeshStandardMaterial({ color: 0x23262c, metalness: .9, roughness: .38 }),
  blackPlastic: new THREE.MeshStandardMaterial({ color: 0x0c0d10, roughness: .45, metalness: .1 }),
  wood: new THREE.MeshStandardMaterial({ map: woodTex(), roughness: .42, metalness: 0, envMapIntensity: .6 }),
  deskBody: new THREE.MeshStandardMaterial({ color: 0x14171f, roughness: .3, metalness: .4, envMapIntensity: .7 }),
  fabric: new THREE.MeshStandardMaterial({ map: noiseTex('#202432', 30), roughness: .95 }),
  carpet: new THREE.MeshStandardMaterial({ map: noiseTex('#1a1622', 26, 256, [10, 2]), roughness: 1 }),
  wall: new THREE.MeshStandardMaterial({ color: 0x0b0d14, roughness: .8, metalness: .2 }),
  stage: new THREE.MeshStandardMaterial({ color: 0x0a0d16, roughness: .14, metalness: .5, envMapIntensity: .8 }),
  floor: new THREE.MeshStandardMaterial({ map: floorTex(), roughness: .32, metalness: .2, envMapIntensity: .5 }),
};
const led = (c, i = 3) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: c, emissiveIntensity: i });

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
function rbox(w, h, d, r, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, parent = scene, seg = 32) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
// a と b の間に棒（腕・脚など）を置く
const _up = new THREE.Vector3(0, 1, 0), _v = new THREE.Vector3();
function placeLimb(mesh, a, b, baseLen) {
  _v.subVectors(b, a); const len = _v.length();
  mesh.position.addVectors(a, b).multiplyScalar(.5);
  mesh.quaternion.setFromUnitVectors(_up, _v.normalize());
  mesh.scale.set(1, len / baseLen, 1);
}
// 2本の骨のIK（肩→ひじ→手首）
function solveIK(S, T, l1, l2, pole, outE, outW) {
  const d = _v.subVectors(T, S); let dist = d.length();
  const dir = d.clone().normalize(); dist = clamp(dist, .02, l1 + l2 - 1e-4);
  const a = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
  const p = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  outE.copy(S).addScaledVector(dir, a).addScaledVector(p, h);
  outW.copy(S).addScaledVector(dir, dist);
}

/* ============ 会場 ============ */
const HOST = new THREE.Vector3(0, 0, -9.6);
// 床
const floor = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), M.floor);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
// 出場者エリアのカーペット
const rug = new THREE.Mesh(new THREE.CircleGeometry(4.6, 64), M.carpet);
rug.rotation.x = -Math.PI / 2; rug.position.set(.7, .005, -3.6); rug.receiveShadow = true; scene.add(rug);
const rugEdge = new THREE.Mesh(new THREE.RingGeometry(4.6, 4.65, 96), led(0x37c8ff, 1.2));
rugEdge.rotation.x = -Math.PI / 2; rugEdge.position.set(.7, .007, -3.6); scene.add(rugEdge);

// ステージ
const stage = new THREE.Group(); scene.add(stage);
box(11, .5, 6.6, M.stage, 0, .25, -11.9, stage);
box(11.02, .04, .03, led(0x37c8ff, 4), 0, .5, -8.6, stage, false);   // 前のLEDライン
box(11.02, .03, .02, led(0x37c8ff, 2), 0, .06, -8.58, stage, false);
for (let i = -2; i <= 2; i++) box(1.6, .012, .012, led(0x2a7bff, 2), i * 2.1, .505, -10.6, stage, false);
// 司会台のまわりの光る円
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.25, .02, 8, 96), led(0x4bb8ff, 2.5));
ring.rotation.x = -Math.PI / 2; ring.position.set(HOST.x, .51, HOST.z - .2); stage.add(ring);

// 後ろの壁とLEDの縦ライン
box(34, 13, .3, M.wall, 0, 6.5, -15.4);
for (let i = -11; i <= 11; i++) {
  if (Math.abs(i) <= 3) continue;
  box(.05, 9, .04, led(i % 2 ? 0x2a4cff : 0x6a2cff, 1.6), i * 1.3, 4.8, -15.2, scene, false);
}
// 横の壁と天井
box(.3, 13, 40, M.wall, -16, 6.5, -2); box(.3, 13, 40, M.wall, 16, 6.5, -2);
box(34, .3, 40, M.wall, 0, 11, -2, scene, false);

// 大型ビジョン
const visionCanvas = document.createElement('canvas'); visionCanvas.width = 1280; visionCanvas.height = 720;
const visionTex = new THREE.CanvasTexture(visionCanvas); visionTex.colorSpace = THREE.SRGBColorSpace;
const vision = new THREE.Mesh(new THREE.PlaneGeometry(8.4, 4.725), new THREE.MeshBasicMaterial({ map: visionTex }));
vision.position.set(0, 4.15, -15.0); scene.add(vision);
box(8.7, 5.0, .2, M.darkMetal, 0, 4.15, -15.15);
box(8.72, .025, .03, led(0x37c8ff, 3), 0, 1.64, -15.0, scene, false);
box(8.72, .025, .03, led(0x37c8ff, 3), 0, 6.66, -15.0, scene, false);

// 天井のトラスと照明器具
const beams = [];
function truss(len, x, y, z, rotY = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rotY; scene.add(g);
  const s = .3;
  for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const c = cyl(.022, .022, len, M.metal, 0, a * s / 2, b * s / 2, g, 8); c.rotation.z = Math.PI / 2; c.castShadow = false;
  }
  const n = Math.floor(len / s);
  for (let i = 0; i < n; i++) {
    const xx = -len / 2 + i * s + s / 2;
    for (const b of [-1, 1]) { const d = cyl(.01, .01, s * 1.414, M.metal, xx, 0, b * s / 2, g, 6);
      d.rotation.z = (i % 2 ? 1 : -1) * Math.PI / 4; d.castShadow = false; }
  }
  return g;
}
const beamMat = (c) => new THREE.ShaderMaterial({
  uniforms: { col: { value: new THREE.Color(c) }, op: { value: .09 } },
  vertexShader: 'varying float vy; void main(){ vy = uv.y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 col; uniform float op; varying float vy; void main(){ gl_FragColor = vec4(col, op*pow(vy,1.6)); }',
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false
});
function fixture(pos, target, color, beam = true) {
  const g = new THREE.Group(); g.position.copy(pos); scene.add(g);
  const body = cyl(.14, .18, .34, M.blackPlastic, 0, 0, 0, g, 16); body.castShadow = false;
  const lens = new THREE.Mesh(new THREE.CircleGeometry(.15, 24), led(color, 4)); g.add(lens);
  const dir = new THREE.Vector3().subVectors(target, pos).normalize();
  body.quaternion.setFromUnitVectors(_up, dir.clone().negate());
  lens.position.copy(dir.clone().multiplyScalar(.175)); lens.lookAt(target);
  if (beam) {
    const len = pos.distanceTo(target) * .92;
    const cone = new THREE.Mesh(new THREE.CylinderGeometry(.15, .9, len, 32, 1, true), beamMat(color));
    cone.geometry.translate(0, -len / 2, 0);
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir);
    g.add(cone); beams.push(cone);
  }
  return g;
}
truss(24, 0, 8.2, -12.5); truss(24, 0, 8.2, -6.5); truss(24, 0, 8.2, -.5);
const fixtures = [
  [[-4, 8, -12.5], [-2.5, .5, -9.5], 0x4a7dff], [[4, 8, -12.5], [2.5, .5, -9.5], 0x9a4dff],
  [[-8, 8, -12.5], [-4, 0, -11], 0x3fc0ff], [[8, 8, -12.5], [4, 0, -11], 0x3fc0ff],
  [[-2, 8, -6.5], [-1.3, .8, -1.2], 0xfff1dd], [[2, 8, -6.5], [1.3, .8, -1.2], 0xfff1dd],
  [[-6, 8, -6.5], [-3.6, .8, -2], 0xffe7c8], [[6, 8, -6.5], [3.6, .8, -2], 0xffe7c8],
  [[0, 8, -.5], [0, .8, -9.6], 0xfff6ea],
];
for (const [p, t, c] of fixtures) fixture(new THREE.Vector3(...p), new THREE.Vector3(...t), c);
// スピーカー
for (const x of [-6.2, 6.2]) { const s = rbox(.7, 1.6, .6, .05, M.blackPlastic, x, 6.6, -12.9); s.rotation.x = .15; }

/* ============ 照明 ============ */
scene.add(new THREE.HemisphereLight(0x8090c0, 0x100c10, .2));
function spot(color, I, pos, target, angle, pen, shadow) {
  const s = new THREE.SpotLight(color, I, 30, angle, pen, 2); s.position.set(...pos);
  s.target.position.set(...target); scene.add(s, s.target);
  if (shadow) { s.castShadow = true; s.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
    s.shadow.bias = -.0004; s.shadow.normalBias = .02; s.shadow.camera.near = 2; s.shadow.camera.far = 20; }
  return s;
}
const deskKey = spot(0xfff2e0, 120, [-.6, 8, -5.8], [0, .8, -1.6], .62, .55, true);
const hostKey = spot(0xfff6ea, 120, [0, 8, -4], [0, 1.4, -9.6], .28, .5, true);
spot(0x4a6dff, 120, [-6, 7, -12], [0, .5, -10.5], .7, .8, false);
spot(0x9a4dff, 120, [6, 7, -12], [0, .5, -10.5], .7, .8, false);
const standL = spot(0xffd9b0, 45, [-4, 9, -5], [-8.5, 1.5, -8.5], .75, .9, false);
const standR = spot(0xffd9b0, 45, [4, 9, -5], [8.5, 1.5, -8.5], .75, .9, false);
const fill = new THREE.PointLight(0xa0b4ff, 3, 12, 2); fill.position.set(0, 3, 2); scene.add(fill);

/* ============ 人間（出場者・司会者） ============ */
const SKIN = [0xe8bf9f, 0xdcae8c, 0xc99a78, 0xf0cdb2, 0xb98a6a];
function skinMat(c) { return new THREE.MeshStandardMaterial({ color: new THREE.Color(c).multiplyScalar(.82), roughness: .62, envMapIntensity: .5 }); }
function clothMat(c, r = .85) { return new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0 }); }

function makeHuman(o) {
  const g = new THREE.Group(); const b = o.build || 1, seated = o.seated !== false;
  const skin = skinMat(o.skin), shirt = clothMat(o.shirt), pants = clothMat(o.pants || 0x22252c),
        hairM = clothMat(o.hair, .6), dark = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: .3 });
  const hipY = seated ? .52 : .98, hipZ = seated ? .56 : 0, shY = hipY + .5, lean = seated ? -.08 : 0;
  const P = {}; g.userData = P;
  // 胴体
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.16 * b, .3, 6, 16), shirt);
  torso.scale.set(1.05, 1, .66); torso.position.set(0, hipY + .26, hipZ + lean / 2); torso.castShadow = true; g.add(torso);
  if (o.jacket) { const j = new THREE.Mesh(new THREE.CapsuleGeometry(.168 * b, .3, 6, 16), clothMat(o.jacket, .7));
    j.scale.set(1.08, 1, .7); j.position.copy(torso.position); j.position.z += .008; j.castShadow = true; g.add(j);
    const shirtV = box(.08, .22, .02, clothMat(0xf2f2f2), 0, hipY + .4, hipZ + lean / 2 - .118, g);
    if (o.tie) box(.035, .2, .01, clothMat(o.tie, .5), 0, hipY + .38, hipZ + lean / 2 - .13, g); }
  P.torso = torso;
  // 肩
  P.shL = new THREE.Vector3(-.19 * b, shY, hipZ + lean); P.shR = new THREE.Vector3(.19 * b, shY, hipZ + lean);
  for (const s of [P.shL, P.shR]) { const m = new THREE.Mesh(new THREE.SphereGeometry(.07 * b, 16, 12), o.jacket ? clothMat(o.jacket, .7) : shirt);
    m.position.copy(s); m.castShadow = true; g.add(m); }
  // 首と頭
  cyl(.045, .05, .12, skin, 0, shY + .06, hipZ + lean, g, 12);
  const head = new THREE.Group(); head.position.set(0, shY + .2, hipZ + lean - .01); g.add(head); P.head = head;
  const skull = new THREE.Mesh(new THREE.SphereGeometry(.1, 32, 24), skin); skull.scale.set(.92, 1.12, 1); skull.castShadow = true; head.add(skull);
  const jaw = new THREE.Mesh(new THREE.SphereGeometry(.075, 24, 16), skin); jaw.position.set(0, -.055, -.02); jaw.scale.set(1, .8, 1); head.add(jaw);

/* ============ 問題（試作用の5問） ============ */
const QUESTIONS = [
  { q: '日本で一番高い山は富士山ですが、2番目に高い山は何でしょう？', a: '北岳', y: 'きただけ' },
  { q: '1年でいちばん昼が長い日を夏至といいますが、いちばん昼が短い日を何というでしょう？', a: '冬至', y: 'とうじ' },
  { q: '日本の都道府県で、面積がいちばん小さいのは香川県ですが、いちばん大きいのはどこでしょう？', a: '北海道', y: 'ほっかいどう' },
  { q: '太陽系の惑星で、太陽にいちばん近いのは水星ですが、いちばん遠いのは何でしょう？', a: '海王星', y: 'かいおうせい' },
  { q: '水がこおる温度は0度ですが、1気圧で水がふっとうする温度は何度でしょう？', a: '100度', y: '100' },
];
const ROWS = ['あいうえお', 'かきくけこ', 'さしすせそ', 'たちつてと', 'なにぬねの', 'はひふへほ', 'まみむめも', 'や ゆ よ', 'らりるれろ', 'わ を ん',
  'がぎぐげご', 'ざじずぜぞ', 'だぢづでど', 'ばびぶべぼ', 'ぱぴぷぺぽ'];
const SMALL = { 'っ': 'つ', 'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ', 'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お' };
function choicesFor(c) {
  const pool = new Set();
  if (/[0-9]/.test(c)) '0123456789'.split('').forEach(x => pool.add(x));
  else if (SMALL[c]) { pool.add(SMALL[c]); Object.keys(SMALL).forEach(x => pool.add(x)); }
  else {
    for (let r = 0; r < ROWS.length; r++) { const k = ROWS[r].indexOf(c); if (k < 0) continue;
      ROWS[r].split('').forEach(x => x !== ' ' && pool.add(x));
      ROWS.forEach(row => row[k] && row[k] !== ' ' && pool.add(row[k])); }
    if (pool.size < 4) 'あいうえおかきくけこ'.split('').forEach(x => pool.add(x));
  }
  pool.delete(c);
  const others = [...pool].sort(() => Math.random() - .5).slice(0, 3);
  return [c, ...others].sort(() => Math.random() - .5);
}

/* ============ ゲームの進行 ============ */

  hint: document.getElementById('hint'), qno: document.getElementById('qno'), score: document.getElementById('score') };

function startQuestion() {
  G.phase = 'reading'; G.shown = 0; G.acc = 0; G.buzzer = -1; G.locked = new Set(); G.judge = null; G.idleAfterEnd = 0;

}
function showChoices() {

    b.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); pickChar(ch); }); ui.choices.appendChild(b); });

function pickChar(ch) {

/* ============ 毎フレームの更新 ============ */

    r.b['Head'].scale.setScalar(.001);
    const wl = MY_WRIST.L.clone(); wl.y += Math.sin(t * 1.1 + 2) * .002;
    const wr = MY_WRIST.R.clone().lerp(PRESS_WRIST, pk); wr.y += (myPress.arc || 0) * (pk > 0 ? 1 : 0) + Math.sin(t * 1.1) * .002;
    r.arm('L', g.localToWorld(wl), { yaw: .3, curl: .38, out: .55 });
    r.arm('R', g.localToWorld(wr), { yaw: lerp(.35, .1, pk), pitch: lerp(-.06, -.25, pk), curl: lerp(.38, .12, pk), out: .55 });
  }
  // 自分のボタン
  me.cap.position.y = .062 - .011 * clamp((pk - .85) / .15, 0, 1);
  // ほかの出場者
  for (let i = 0; i < 4; i++) {
    if (i === ME) continue;
    const S = seats[i], r = S.rig; if (!r) continue;
    let k = 0, arc = 0;
    if (S.pressT >= 0) { S.pressT += dt; const pc = pressCurve(S.pressT); if (!pc) S.pressT = -1; else { k = pc.k; arc = pc.arc; } }
    S.cap.position.y = .062 - .011 * clamp((k - .85) / .15, 0, 1);
    // 頭：ふだんはモニター、ほかの人が押したらそっちを見る
    let hy = 0, hp = .45;
    if (G.buzzer >= 0 && G.buzzer !== i) { const d = seats[G.buzzer].g.position.clone().sub(S.g.position).applyAxisAngle(_up, -S.g.rotation.y);
      hy = clamp(Math.atan2(-d.x, -d.z), -.8, .8); hp = .1; }
    else if (G.phase === 'judge' && G.judge && G.judge.i === i) hp = G.judge.ok ? .05 - Math.sin(G.judge.t * 7) * .08 * Math.max(0, 1 - G.judge.t) : .6;
    else if (G.phase === 'title' || G.phase === 'ready' || G.phase === 'reveal') hp = .1;
    S.hy = lerp(S.hy || 0, hy + Math.sin(t * .5 + i * 2) * .04, Math.min(1, dt * 6)); S.hp = lerp(S.hp ?? .4, hp, Math.min(1, dt * 5));
    r.reset(); r.placePelvis(S.g.localToWorld(SEAT_PELVIS.clone().add(new THREE.Vector3(0, Math.sin(t * 1.5 + i) * .003, -k * .04)))); r.sit(.1 + k * .1);
    r.look(S.hy, S.hp);
    const wl = new THREE.Vector3(-.22, .8, .02), wr = new THREE.Vector3(.24, .8, .02).lerp(new THREE.Vector3(.14, .885, .015), k); wr.y += arc;
    r.arm('L', S.g.localToWorld(wl), { yaw: .3, curl: .4 }); r.arm('R', S.g.localToWorld(wr), { yaw: lerp(.35, .1, k), pitch: lerp(-.06, -.25, k), curl: lerp(.4, .12, k) });
  }
  // 司会者
  if (hostRig) { const r = hostRig;
    let hy = Math.sin(t * .3) * .3;
    if (G.buzzer >= 0) { const d = hostSpot.worldToLocal(seats[G.buzzer].g.position.clone()); hy = clamp(Math.atan2(-d.x, -d.z), -.7, .7); }
    S_host.hy = lerp(S_host.hy, hy, Math.min(1, dt * 3));
    r.reset(); r.look(S_host.hy, .12);
    const up = (G.phase === 'judge' && G.judge && G.judge.ok && G.judge.t < 1.4) ? 1 : 0;
    r.arm('L', hostSpot.localToWorld(new THREE.Vector3(-.2, 1.1, -.3)), { yaw: .3, curl: .45 });
    r.arm('R', hostSpot.localToWorld(up ? new THREE.Vector3(.35, 1.45, -.25) : new THREE.Vector3(.2, 1.1 + Math.sin(t * .9) * .01, -.3)), { yaw: .3, curl: up ? .1 : .45, pitch: up ? .8 : -.06, roll: up ? 1.2 : 0 });
  }
  // 観客
  updateAudience(t, dt);
  // 名札のランプ（押した人）
  for (const S of seats) S.lamp.material.emissiveIntensity = (G.phase === 'answering' && G.buzzer === S.i) ? 3 + Math.sin(t * 20) * 1 : 0;
  // カメラ：読んでいるときはモニターへ視線、ほかの人が押したら少しそちらへ
  let wantPitch = (G.phase === 'reading' || G.phase === 'answering') ? -.3 : -.16, wantYaw = 0;
  if (G.buzzer >= 0 && G.buzzer !== ME && G.phase !== 'reading') { const d = seats[G.buzzer].g.position.clone().sub(me.g.position).applyAxisAngle(_up, -me.g.rotation.y);
    wantYaw = Math.atan2(-d.x, -d.z) * .3; wantPitch = -.22; }
  yaw = lerp(yaw, wantYaw, Math.min(1, dt * 2.2)); pitch = lerp(pitch, wantPitch, Math.min(1, dt * 2.2));
  // 問題を読んでいる間はモニターへズーム（入るときはゆっくり、出るときは素早く）
  if (freeCam) { drawMonitor(t); return; }
  const zoomWant = (G.phase === 'reading' || (G.phase === 'answering' && G.buzzer === ME)) ? 1 : 0;
  zoomK = zoomWant > zoomK ? Math.min(1, zoomK + dt / .9) : Math.max(0, zoomK - dt / .28);
  const ez = easeInOut(zoomK);
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  // モニター（上）とボタン（下）が両方入る距離まで寄る
  const dist = Math.max((.52 / .94 / 2) / (tanH * camera.aspect), (.44 / .94 / 2) / tanH);
  const zoomPos = ZOOM_T.clone().addScaledVector(ZOOM_F, -dist);
  const basePos = new THREE.Vector3(CAM_BASE.x, CAM_BASE.y + Math.sin(t * 1.6) * .002 + lean * .2, CAM_BASE.z + lean * .55);
  camera.position.lerpVectors(basePos, zoomPos, ez);
  camera.rotation.set(lerp(pitch + Math.sin(t * 1.6) * .003 + lean * .25, ZOOM_PITCH + lean * .25 * ez, ez), lerp(yaw + Math.sin(t * .37) * .004, 0, ez), 0);
  // 光の柱をゆっくり動かす
  beams.forEach((b, k) => b.material.uniforms.op.value = .07 + Math.sin(t * .6 + k) * .02 + (G.judge && G.judge.ok && G.judge.t < 1.5 ? .06 : 0));
  ring.material.emissiveIntensity = 2.2 + Math.sin(t * 2) * .5;
  drawMonitor(t);
}
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  update(dt, t);
  if (useBloom) composer.render(); else renderer.render(scene, camera);
  // 重いときは自動で画質を下げる
  if (!fpsChecked && t > 2) { fpsAcc += dt; fpsN++; if (fpsN >= 120) { const fps = fpsN / fpsAcc; fpsChecked = true;
    if (fps < 40) { pixelRatio = Math.max(1, pixelRatio * .75); renderer.setPixelRatio(pixelRatio); composer.setPixelRatio(pixelRatio); if (fps < 28) useBloom = false; } } }
  requestAnimationFrame(frame);
}
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1.4 ? 66 : 58;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize); onResize();
drawVision(); drawMonitor(0);
/* ============ モデルの読み込み ============ */
const gl = new GLTFLoader();
let loadedN = 0, totalN = 1;
// models/○○.glb を読む。置けない場所では、同じ中身を文字にした ○○.glb.txt を読む
async function fetchModel(name) {
  try { const r = await fetch('models/' + name + '.glb'); if (r.ok && !(r.headers.get('content-type') || '').includes('text/html')) return await r.arrayBuffer(); } catch (e) {}
  const t = await (await fetch('models/' + name + '.glb.txt')).text();
  const bin = atob(t.trim()), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer;
}
function loadGLB(name) {
  return fetchModel(name).then(buf => { loadedN++; showProg(); return new Promise((res, rej) => gl.parse(buf, '', res, rej)); });
}
function showProg() { document.getElementById('load').textContent = `会場を準備中… ${Math.floor(loadedN / totalN * 100)}%`; }
(async () => {
  try {
    const names = [...new Set(Object.values(AVATARS))]; totalN = names.length + 1; showProg();
    const [aud, ...chars] = await Promise.all([loadGLB('audience'), ...names.map(loadGLB)]);
    const byName = {}; names.forEach((n, i) => byName[n] = chars[i]);
    buildAudience(aud);
    for (let i = 0; i < 4; i++) seats[i].rig = setupAvatar(byName[AVATARS[i]], seats[i].g);
    hostRig = setupAvatar(byName[AVATARS.host], hostSpot);
    // 自分の目がカメラの位置に来るように体を合わせる
    const r = me.rig; r.reset(); r.placePelvis(me.g.localToWorld(SEAT_PELVIS.clone())); r.sit(.06);
    const eye = me.g.worldToLocal(r.wp('LEye').add(r.wp('REye')).multiplyScalar(.5));
    myPelvis = SEAT_PELVIS.clone().add(CAM_BASE.clone().sub(eye)).add(new THREE.Vector3(0, 0, .03));
    update(0.016, clock.elapsedTime);
    renderer.compile(scene, camera);
    ready = true; document.getElementById('load').textContent = '準備できました';
  } catch (e) { console.error(e); document.getElementById('load').textContent = '読み込みに失敗しました。ページを開き直してください'; }
})();
window.__G = G; window.__onPress = onPress;
let freeCam = false; window.__view = (p, t) => { freeCam = true; scene.attach(camera); camera.position.set(...p); camera.lookAt(...t); };
frame();
</script>
